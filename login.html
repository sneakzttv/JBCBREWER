<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>JBC Brewer — Login</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body class="login-page">


<div class="login-shell">


    <div class="login-art">

        <img
            src="beer.svg"
            alt="Cartoon beer mug"
        >

    </div>


    <div class="login-card">


        <div class="login-logo">
            🍺
        </div>


        <h1>
            JBC BREWER RECIPES
        </h1>


        <p class="login-subtitle">
            Brewing tools, recipes and foam-retention calculations.
        </p>


        <div
            id="login-error"
            class="alert error hidden"
        >
            Incorrect password. Please try again.
        </div>


        <form id="login-form">

            <div class="form-group">

                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="current-password"
                    placeholder="Enter password"
                    required
                    autofocus
                >

            </div>


            <button
                type="submit"
                class="button primary login-button"
            >
                Enter Brewery
            </button>

        </form>


        <p class="login-note">
            Beer as cold as your ex's heart!
        </p>


    </div>


</div>


<script>

const PASSWORD = "Fanni4beer";

const form =
    document.getElementById("login-form");

const password =
    document.getElementById("password");

const error =
    document.getElementById("login-error");


if (
    new URLSearchParams(
        window.location.search
    ).get("logout") === "1"
) {

    localStorage.removeItem(
        "fraLoggedIn"
    );

}


if (
    localStorage.getItem(
        "fraLoggedIn"
    ) === "true"
) {

    window.location.href = "index.html";

}


form.addEventListener(
    "submit",
    function(event) {

        event.preventDefault();


        if (
            password.value === PASSWORD
        ) {

            localStorage.setItem(
                "fraLoggedIn",
                "true"
            );

            window.location.href =
                "index.html";

        } else {

            error.classList.remove(
                "hidden"
            );

            password.value = "";

            password.focus();

        }

    }
);

</script>


</body>

</html>

<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 300 300"
>

    <defs>

        <linearGradient
            id="beer"
            x1="0"
            y1="0"
            x2="0"
            y2="1"
        >

            <stop
                offset="0%"
                stop-color="#ffd95a"
            />

            <stop
                offset="100%"
                stop-color="#e99a12"
            />

        </linearGradient>

        <linearGradient
            id="glass"
            x1="0"
            y1="0"
            x2="1"
            y2="1"
        >

            <stop
                offset="0%"
                stop-color="#ffffff"
                stop-opacity="0.55"
            />

            <stop
                offset="100%"
                stop-color="#ffffff"
                stop-opacity="0.08"
            />

        </linearGradient>

    </defs>


    <!-- shadow -->

    <ellipse
        cx="150"
        cy="263"
        rx="82"
        ry="14"
        fill="#000000"
        opacity="0.25"
    />


    <!-- handle -->

    <path
        d="
            M218 105
            C265 95 270 125 270 158
            C270 193 253 210 217 201
            L217 180
            C240 186 249 175 249 155
            C249 133 240 126 218 129
            Z
        "
        fill="#d98a13"
        stroke="#7c4a0b"
        stroke-width="7"
    />


    <!-- glass -->

    <path
        d="
            M63 76
            L77 235
            C79 251 91 258 108 260
            L191 260
            C208 258 220 251 222 235
            L237 76
            Z
        "
        fill="url(#glass)"
        stroke="#f4c86b"
        stroke-width="7"
    />


    <!-- beer -->

    <path
        d="
            M72 113
            L82 231
            C83 244 92 250 107 252
            L191 252
            C205 250 214 244 216 231
            L228 113
            Z
        "
        fill="url(#beer)"
    />


    <!-- foam -->

    <path
        d="
            M54 83
            C55 66 70 56 84 61
            C86 45 101 37 116 46
            C125 31 150 32 159 49
            C174 37 198 44 201 61
            C219 55 238 68 238 84
            C238 101 225 110 209 108
            C197 117 180 113 171 105
            C159 115 139 112 129 102
            C115 114 94 110 88 101
            C71 110 54 100 54 83
            Z
        "
        fill="#fff4d6"
        stroke="#e8d2a0"
        stroke-width="5"
    />


    <!-- highlights -->

    <path
        d="
            M97 130
            L105 220
        "
        stroke="#ffffff"
        stroke-width="8"
        stroke-linecap="round"
        opacity="0.35"
    />


    <!-- face -->

    <circle
        cx="125"
        cy="168"
        r="6"
        fill="#6d3d09"
    />

    <circle
        cx="177"
        cy="168"
        r="6"
        fill="#6d3d09"
    />


    <path
        d="
            M130 193
            C141 204 161 204 173 192
        "
        fill="none"
        stroke="#6d3d09"
        stroke-width="6"
        stroke-linecap="round"
    />

</svg>
